name: events-app

on:
  push:
    paths: ['events-app/**', '.github/workflows/events-app.yml']
  pull_request:
    paths: ['events-app/**', '.github/workflows/events-app.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: events-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: events-app/package-lock.json
      - run: npm ci
      - run: npm test
