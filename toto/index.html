<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>טוטו חכם</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="ניחושים מנומקים לטוטו ולווינר: סיכויים, ראש בראש, טבלאות, מעקב דיוק ולמידה שבועית">
<meta name="theme-color" content="#0a3b2a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;600;700;800&family=Heebo:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/style.css?v=202611261245">
</head>
<body>
<div id="app" dir="rtl">
  <header class="top">
    <div class="top-in">
      <a class="brand" href="#home" data-go="home" aria-label="טוטו חכם – דף הבית">
        <span class="brand-mark" aria-hidden="true"><i>1</i><i>X</i><i>2</i></span>
        <span class="brand-name">טוטו חכם</span>
      </a>
      <nav class="tabs" aria-label="ניווט ראשי">
        <button data-go="home">ראשי</button>
        <button data-go="form">ווינר 16</button>
        <button data-go="basket">ווינר סל</button>
        <button data-go="line">ווינר ליין</button>
        <button data-go="week">משחקים</button>
        <button data-go="track">דיוק</button>
        <button data-go="tables">טבלאות</button>
        <button data-go="games">כל המשחקים</button>
      </nav>
      <button class="menu-btn" id="menu-btn" aria-label="תפריט"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z"/></svg></button>
      <span class="fresh" id="status" role="status">טוען…</span>
    </div>
  </header>

  <main class="wrap">
    <section id="view-home" class="view" hidden></section>
    <section id="view-form" class="view" hidden>
      <div class="page-head">
        <div>
          <p class="eyebrow">ווינר 16</p>
          <h1>הטופס שלי</h1>
          <p class="sub" id="form-sub"></p>
        </div>
        <div class="actions">
          <button class="btn primary" id="btn-official" hidden>טופס ווינר 16 של השבוע</button>
          <button class="btn" id="btn-autofill">מילוי מהמשחקים הקרובים</button>
          <button class="btn" id="btn-add-manual">הוספת משחק</button>
          <button class="btn" id="btn-copy">העתקה</button>
          <button class="btn ghost" id="btn-clear">ניקוי</button>
        </div>
      </div>
      <div class="system card-surface">
        <div class="sys-controls">
          <label class="field"><span>שיטת מילוי</span>
            <select id="sys-mode"><option value="cols">לפי מספר טורים</option><option value="dt">לפי כפולים ומשולשים</option></select></label>
          <label class="field" id="f-cols"><span>מקסימום טורים</span><select id="sys-cols"></select></label>
          <label class="field" id="f-d" hidden><span>כפולים</span><input id="sys-d" type="number" min="0" max="16" value="3" inputmode="numeric"></label>
          <label class="field" id="f-t" hidden><span>משולשים</span><input id="sys-t" type="number" min="0" max="16" value="1" inputmode="numeric"></label>
          <label class="field"><span>מחיר טור (₪)</span><input id="sys-price" type="number" min="0" step="0.5" value="3" inputmode="decimal"></label>
        </div>
        <div class="kpis" id="sys-summary"></div>
      </div>
      <ol class="slip" id="slip"></ol>
      <div id="prize-box"></div>
      <div id="saved-box"></div>
      <p class="hint">לחיצה על 1 / X / 2 קובעת ניחוש ידני (שאר הטופס מתאים את עצמו). לחיצה על שם המשחק פותחת ניתוח מלא.</p>
    </section>
    <section id="view-week" class="view" hidden>
      <div class="page-head">
        <div><p class="eyebrow">לוח משחקים</p><h1>משחקים וניחושים</h1></div>
      </div>
      <div class="filters">
        <div class="seg" role="group" aria-label="טווח תאריכים">
          <button data-range="week">7 ימים</button>
          <button data-range="weekend">סוף השבוע</button>
          <button data-range="next">השבוע הבא</button>
        </div>
        <label class="field inline"><span>מ־</span><input type="date" id="w-from"></label>
        <label class="field inline"><span>עד</span><input type="date" id="w-to"></label>
      </div>
      <div class="league-chips" id="league-chips"></div>
      <div id="week-list"></div>
    </section>
    <section id="view-track" class="view" hidden></section>
    <section id="view-tables" class="view" hidden>
      <div class="page-head">
        <div><p class="eyebrow">עונה נוכחית</p><h1>טבלאות</h1></div>
        <label class="field"><span>ליגה</span><select id="t-league"></select></label>
      </div>
      <div id="table-box"></div>
    </section>
    <section id="view-info" class="view" hidden></section>
    <section id="view-basket" class="view" hidden></section>
    <section id="view-line" class="view" hidden></section>
    <section id="view-games" class="view" hidden></section>
  </main>

  <div class="live-dock" id="live-dock" aria-label="תוצאות חיות"></div>

  <nav class="bottom-nav" aria-label="ניווט">
    <button data-go="home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>ראשי</span></button>
    <button data-go="form"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 2.2 2.6 1.9-1 3.1H10.4l-1-3.1zM5.4 8.3l2.4.8 1 3.1-2 2.6-2.5-.1A7.9 7.9 0 0 1 5.4 8.3zm13.2 0a7.9 7.9 0 0 1 1.1 6.4l-2.5.1-2-2.6 1-3.1zM10 14.6h4l1.3 2.6-1.4 2.6a8 8 0 0 1-3.8 0l-1.4-2.6z"/></svg><span>ווינר 16</span></button>
    <button data-go="basket"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm7.9 9h-3.9a12 12 0 0 1 2.3-5.6A8 8 0 0 1 19.9 11zM13 4.1A8 8 0 0 1 16.9 5 13.9 13.9 0 0 0 14 11h-1zm-2 0V11h-1a13.9 13.9 0 0 0-2.9-6A8 8 0 0 1 11 4.1zM5.7 5.4A12 12 0 0 1 8 11H4.1a8 8 0 0 1 1.6-5.6zM4.1 13H8a12 12 0 0 1-2.3 5.6A8 8 0 0 1 4.1 13zm6.9 6.9A8 8 0 0 1 7.1 19 13.9 13.9 0 0 0 10 13h1zm2 0V13h1a13.9 13.9 0 0 0 2.9 6 8 8 0 0 1-3.9.9zm5.3-1.3A12 12 0 0 1 16 13h3.9a8 8 0 0 1-1.6 5.6z"/></svg><span>ווינר סל</span></button>
    <button data-go="line"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16v4H4zm0 6h10v4H4zm0 6h16v4H4z"/></svg><span>ליין</span></button>
    <button data-go="track"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19h16v2H4zM6 10h3v7H6zm5-4h3v11h-3zm5 7h3v4h-3z"/></svg><span>דיוק</span></button>
  </nav>

  <div class="sheet-back" id="sheet-back" hidden></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" hidden>
    <div class="sheet-bar"><span class="grab" aria-hidden="true"></span><button class="btn ghost small" id="sheet-close">סגירה ✕</button></div>
    <div class="sheet-body" id="sheet-body"></div>
  </div>
  <div class="toast" id="toast" hidden></div>
</div>
<script src="js/names.js?v=202611261245"></script>
<script src="js/engine.js?v=202611261245"></script>
<script src="js/basket.js?v=202611261245"></script>
<script src="js/pages.js?v=202611261245"></script>
<script src="js/app.js?v=202611261245"></script>
<script src="js/live.js?v=202611261245"></script>
</body>
</html>
